[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decoupling-2d-topological-css-codes"
version = "0.2.0"
description = "SageMath decoupling unitary and decoder for translational topological CSS codes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pymatching>=2.1",
]
authors = [
  { name = "Mingxin He" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
benchmark = [
  "ldpc==2.4.1",
  "matplotlib>=3.7",
]
test = [
  "coverage>=7",
  "jupyter>=1",
  "ldpc==2.4.1",
  "matplotlib>=3.7",
  "nbconvert>=7",
]

[tool.setuptools.packages.find]
include = [
  "decoder_core",
  "decoupling",
  "decoupling.*",
  "unitary_decouple_based_decoder",
]
exclude = [
  "color_code_decoders*",
  "dense_toric_matching_decoder*",
]
