name: CI

on:
  push:
  pull_request:

jobs:
  release-checks:
    name: release-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release checks
        run: |
          python3 -m unittest discover -s tests/release -v
          python3 tools/verify_release.py
          make verify-manifest

  sagemath:
    name: sagemath
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Python/SageMath checks in SageMath container
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -e HOME=/tmp/sage-home \
            -e SAGE_ROOT=/home/sage/sage \
            -v "$PWD:/workspace" \
            -w /workspace \
            sagemath/sagemath:10.8 \
            -lc '
              set -euo pipefail
              SAGE=/home/sage/sage/sage
              mkdir -p "$HOME" "$HOME/.sage"
              cd python
              "$SAGE" -pip install --user -e ".[test]"
              "$SAGE" -python -m compileall -q \
                decoder_core decoupling unitary_decouple_based_decoder
              for test in \
                tests/sage/decoupling/test_*.sage \
                tests/sage/unitary/test_*.sage
              do
                "$SAGE" "$test"
              done
              "$SAGE" scripts/unitary_decouple_based_decoder/benchmark_paper_bb_family.sage --smoke
              "$SAGE" -c \
                "import decoder_core, decoupling, unitary_decouple_based_decoder"
            '

  julia:
    name: julia
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'
      - name: Instantiate and test Julia project
        run: |
          julia --color=yes --project=julia/ToricBuilder -e '
            using Pkg
            Pkg.instantiate(; allow_autoprecomp=false)
            include("julia/ToricBuilder/test/runtests.jl")
          '
